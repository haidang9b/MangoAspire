apiVersion: 1

providers:
  - name: mango
    orgId: 1
    folder: Mango
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # Edits made in the UI survive until the next restart; the JSON files on
    # disk stay the source of truth.
    allowUiUpdates: true
    options:
      # Deliberately outside /var/lib/grafana, which is a Docker volume.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
