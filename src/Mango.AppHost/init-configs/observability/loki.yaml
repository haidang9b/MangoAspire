# Single-binary Loki for local development: every component in one process,
# chunks on the local filesystem, no object store, no multi-tenancy.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion: log attributes that are not promoted to labels
  # are stored as structured metadata rather than dropped.
  allow_structured_metadata: true
  # Powers the log-volume histogram above Grafana's log panels.
  volume_enabled: true
  retention_period: 168h
  max_query_lookback: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
