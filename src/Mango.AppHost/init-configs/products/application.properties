# ======= Debezium Server Core =======
debezium.server.name=product-debezium
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=60000
debezium.source.tombstone.on.delete=false
quarkus.log.console.json=false

# ======= PostgreSQL Connector =======
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
# Connection settings from AppHost environment variables
debezium.source.database.hostname=${DEBEZIUM_SOURCE_DATABASE_HOSTNAME}
debezium.source.database.port=${DEBEZIUM_SOURCE_DATABASE_PORT}
debezium.source.database.user=${DEBEZIUM_SOURCE_DATABASE_USER}
debezium.source.database.password=${DEBEZIUM_SOURCE_DATABASE_PASSWORD}
debezium.source.database.dbname=${DEBEZIUM_SOURCE_DATABASE_DBNAME}
debezium.source.schema.include.list=public
# Update table list based on which database you're monitoring.
# debezium_signal must be captured too — Debezium only reads signals from a table it watches.
debezium.source.table.include.list=public.products,public.catalog_types,public.debezium_signal
debezium.source.column.exclude.list=public.products.available_stock
debezium.source.slot.name=mango_debezium_slot
debezium.source.snapshot.mode=initial
debezium.source.topic.prefix=mango

# ======= Incremental snapshot signals =======
# Lets a table be re-read on demand, re-emitting every row into the stream WITHOUT dropping
# the replication slot or the offsets file. This is the backfill path for a consumer whose
# required history has aged out of the stream's retention window, or for a table added to
# the include list after the initial snapshot already ran.
#
# Trigger it by inserting a row into public.debezium_signal — see the
# POST /api/products/cdc-snapshots endpoint. Debezium interleaves snapshot chunks with live
# changes and de-duplicates its snapshot window; consumers fence on __source_lsn, so
# existing read-models cannot regress while the backfill runs.
debezium.source.signal.enabled.channels=source
debezium.source.signal.data.collection=public.debezium_signal

# ======= Transformations =======
debezium.source.transforms=unwrap
debezium.source.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.source.transforms.unwrap.drop.tombstones=false
debezium.source.transforms.unwrap.delete.handling.mode=rewrite
debezium.source.transforms.unwrap.add.headers=true
# Ordering metadata is injected into the PAYLOAD (as __op, __source_lsn, __source_ts_ms,
# __source_txId), not just the headers, so consumers can fence out stale events during a
# replay without the event bus having to surface AMQP headers to handlers.
# __source_lsn is the Postgres WAL position and is monotonic per cluster.
debezium.source.transforms.unwrap.add.fields=op,source.lsn,source.ts_ms,source.txId

# ======= Key/Value Format =======
debezium.source.key.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.key.converter.schemas.enable=false
debezium.source.value.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.value.converter.schemas.enable=false

############################
# RabbitMQ Sink Settings   #
############################
debezium.sink.type=rabbitmq
# Connection settings from AppHost environment variables
debezium.sink.rabbitmq.connection.host=${DEBEZIUM_SINK_RABBITMQ_CONNECTION_HOST}
debezium.sink.rabbitmq.connection.port=${DEBEZIUM_SINK_RABBITMQ_CONNECTION_PORT}
debezium.sink.rabbitmq.connection.username=${DEBEZIUM_SINK_RABBITMQ_CONNECTION_USERNAME}
debezium.sink.rabbitmq.connection.password=${DEBEZIUM_SINK_RABBITMQ_CONNECTION_PASSWORD}
debezium.sink.rabbitmq.connection.ssl.enabled=false
debezium.sink.rabbitmq.exchange=mango-cdc-exchange
debezium.sink.rabbitmq.autoCreateRoutingKey=true
# debezium.sink.rabbitmq.routingKey=
debezium.sink.rabbitmq.routingKeyFromTopicName=true

# ======= Logging =======
quarkus.log.level=DEBUG
