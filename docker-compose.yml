services:
  postgres:
    # pgvector/pgvector is stock PostgreSQL plus the "vector" extension, which
    # chatagentdb needs. Tag stays on pg16 to match the major version this compose
    # file already used — PostgreSQL cannot read a newer major's data directory.
    image: pgvector/pgvector:pg16
  
  rabbitmq:
    image: rabbitmq:3-management-alpine

  # One-shot: declares the CDC topology, then exits. Debezium waits for it to finish so the
  # initial snapshot cannot be published into a direct exchange with no bindings.
  cdc-topology:
    image: curlimages/curl:8.11.1
    depends_on:
      - rabbitmq
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until curl -sf -u "guest:$$RABBITMQ_PASSWORD" "http://$$RABBITMQ_HOST:15672/api/overview" > /dev/null 2>&1; do
          echo "Waiting for the RabbitMQ management API..."
          sleep 2
        done
        curl -sS --fail-with-body -u "guest:$$RABBITMQ_PASSWORD" \
          -H "content-type: application/json" \
          -X POST --data-binary @/definitions.json \
          "http://$$RABBITMQ_HOST:15672/api/definitions"
        echo "CDC topology imported: mango.cdc.stream is ready."

  debezium:
    image: debezium/server:2.7.3.Final
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
      cdc-topology:
        condition: service_completed_successfully

  identity.api:
    image: ${DOCKER_REGISTRY-}identityapi
    build:
      context: src
      dockerfile: Services/Identity.API/Dockerfile
    depends_on:
      - postgres

  products.api:
    image: ${DOCKER_REGISTRY-}productsapi
    build:
      context: src
      dockerfile: Services/Products.API/Dockerfile
    depends_on:
      - postgres
      - rabbitmq

  coupons.api:
    image: ${DOCKER_REGISTRY-}couponsapi
    build:
      context: src
      dockerfile: Services/Coupons.API/Dockerfile
    depends_on:
      - postgres

  shoppingcart.api:
    image: ${DOCKER_REGISTRY-}shoppingcartapi
    build:
      context: src
      dockerfile: Services/ShoppingCart.API/Dockerfile
    depends_on:
      - postgres
      - rabbitmq

  orders.api:
    image: ${DOCKER_REGISTRY-}ordersapi
    build:
      context: src
      dockerfile: Services/Orders.API/Dockerfile
    depends_on:
      - postgres
      - rabbitmq

  payments.api:
    image: ${DOCKER_REGISTRY-}paymentsapi
    build:
      context: src
      dockerfile: Services/Payments.API/Dockerfile
    depends_on:
      - rabbitmq

  chatagent.app:
    image: ${DOCKER_REGISTRY-}chatagentapp
    build:
      context: src
      dockerfile: Services/ChatAgent.App/Dockerfile
    depends_on:
      - postgres
      - rabbitmq

  saga.orchestrators:
    image: ${DOCKER_REGISTRY-}sagaorchestrators
    build:
      context: src
      dockerfile: Services/Mango.Orchestrators/Dockerfile
    depends_on:
      - postgres
      - rabbitmq

  mango.gateway:
    image: ${DOCKER_REGISTRY-}mangogateway
    build:
      context: src
      dockerfile: Gateway/Mango.Gateway/Dockerfile
    depends_on:
      - products.api
      - orders.api
      - shoppingcart.api
      - coupons.api
      - chatagent.app

  mango.web:
    image: ${DOCKER_REGISTRY-}mangoweb
    build:
      context: src
      dockerfile: UI/Mango.Web/Dockerfile
    depends_on:
      - identity.api
      - mango.gateway

  mango-ui:
    image: ${DOCKER_REGISTRY-}mangoui
    build:
      context: src/UI/mango-ui
      dockerfile: Dockerfile
    depends_on:
      - mango.gateway
